spark.master                              spark://node3:7077
spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type               hadoop
spark.sql.catalog.lake.warehouse          hdfs://node2:9000/searchengine/warehouse
spark.driver.port                         7078
spark.blockManager.port                   7079
spark.executor.memory                     1g
# ~1000 docs: Spark's default of 200 shuffle partitions makes every PageRank iteration
# schedule hundreds of empty tasks. 8 = a few per worker core.
spark.sql.shuffle.partitions              8
